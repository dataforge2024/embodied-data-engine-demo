[project]
name = "robotdatahub-scheduler"
version = "0.1.0"
description = "RobotDataHub Scheduler：事件消费、流水线编排、K8s Job 创建"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "robotdatahub-contract==0.1.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.8.0",
    "celery>=5.4.0",
    "aio-pika>=9.5.0",
]

# 单目录模拟：用本地路径替代私有 registry。真实拆仓后删掉本节。
[tool.uv.sources]
robotdatahub-contract = { path = "../contract", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: 纯函数与业务逻辑单元测试",
    "integration: 涉及外部依赖的集成测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

# celery 不发 py.typed，也没有官方 stub 包
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
